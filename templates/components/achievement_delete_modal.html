<div id="delete-achievement-modal"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-achievement-title">

    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-achievement-modal"
            popovertargetaction="hide"
            aria-label="Close confirmation"></button>

    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-achievement-modal"
                popovertargetaction="hide"
                aria-label="Close confirmation">&times;</button>

        <h2 id="delete-achievement-title">Delete Achievement?</h2>
        <p>
            Are you sure you want to delete
            {# The title is set with textContent by JavaScript, so it is never parsed as HTML #}
            <strong id="delete-achievement-name"></strong>?
        </p>

        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-achievement-modal"
                    popovertargetaction="hide">Cancel</button>
            <button type="button" id="confirm-delete-achievement" class="button button-danger">Yes, Delete</button>
        </div>
    </div>
</div>

<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-experience-{{ experience.pk }}"
            aria-label="Delete {{ experience.title }}"
            title="Delete experience">
        Delete Experience
    </button>
</p>

<div id="delete-experience-{{ experience.pk }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-experience-title-{{ experience.pk }}">
    
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-experience-{{ experience.pk }}"
            popovertargetaction="hide"
            aria-label="Close confirmation"></button>
            
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-experience-{{ experience.pk }}"
                popovertargetaction="hide"
                aria-label="Close confirmation">&times;</button>
                
        <h2 id="delete-experience-title-{{ experience.pk }}">Delete Experience?</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ experience.title }}</strong>?
        </p>
        
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-experience-{{ experience.pk }}"
                    popovertargetaction="hide">Cancel</button>
                    
            <form method="post" action="{% url 'main:delete_experience' experience.pk %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>

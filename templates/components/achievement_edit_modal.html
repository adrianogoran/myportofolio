<div id="edit-achievement-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-achievement-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-achievement-modal"
            popovertargetaction="hide"
            aria-label="Close edit achievement form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-achievement-modal"
                popovertargetaction="hide"
                aria-label="Close edit achievement form">X</button>

        <h2 id="edit-achievement-modal-title">Edit Achievement</h2>
        {# Filled by JavaScript and sent to the API with PATCH #}
        <form id="edit-achievement-form" class="project-form">
            {% for field in edit_form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-achievement-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save Changes</button>
            </div>
        </form>
    </div>
</div>
